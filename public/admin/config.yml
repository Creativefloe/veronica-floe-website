              - name: heading
                label: Overskrift / Heading
                widget: string
                i18n: true
              - name: text
                label: Tekst / Text
                widget: text
                i18n: true
              - name: cta
                label: Lenketekst / Link text
                widget: string
                i18n: true
              - name: imageAlt
                label: Beskrivelse av portrettet / Portrait description
                widget: string
                i18n: true
            i18n: true
          - name: testimonials
            label: Tilbakemeldinger / Testimonials
            widget: object
            fields:
              - name: heading
                label: Overskrift / Heading
                widget: string
                i18n: true
              - name: items
                label: Tilbakemeldinger (vises når minst én er lagt til) / Testimonials (shown once at least one is added)
                widget: list
                fields:
                  - name: quote
                    label: Sitat / Quote
                    widget: text
                    i18n: true
                  - name: name
                    label: Navn / Name
                    widget: string
                    i18n: true
                  - name: session
                    label: Type fotografering / Session type
                    widget: string
                    required: false
                    i18n: true
                required: false
                summary: "{{fields.name}}"
                i18n: true
            i18n: true
          - name: finalCta
            label: Oppfordring nederst / Call to action at the bottom
            widget: object
            fields:
              - name: heading
                label: Overskrift / Heading
                widget: string
                i18n: true
              - name: text
                label: Tekst / Text
                widget: text
                i18n: true
            i18n: true
