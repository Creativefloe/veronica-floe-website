# Sveltia CMS configuration for creativefloe.com (opens at /admin/)
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: creativefloe/creative-floe
  branch: main
site_url: https://creativefloe.com
display_url: https://creativefloe.com
logo_url: /favicon.svg
media_folder: src/assets/images/photos
public_folder: /src/assets/images/photos
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2560
          height: 2560
i18n:
  structure: single_file
  locales:
    - "no"
    - en
  default_locale: "no"
collections:
  - name: portfolio
    label: Portefølje / Portfolio
    icon: photo_library
    description: Legg til, fjern eller endre rekkefølge på bilder. Det første bildet i hver kategori vises også på kortene for fotograferinger. / Add, remove or reorder photos. The first photo in each category is also used on the session cards.
    files:
      - name: photos
        label: Bilder / Photos
        file: src/content/portfolio.json
        format: json
        fields:
          - name: photos
            label: Bilder / Photos
            widget: list
            fields:
              - name: image
                label: Bilde / Photo
                widget: image
              - name: category
                label: Kategori / Category
                widget: select
                options:
                  - label: Par og forlovelse / Couples
                    value: couples
                  - label: Gravid / Pregnancy
                    value: pregnancy
                  - label: Familie / Family
                    value: family
                  - label: Portrett / Portrait
                    value: portrait
              - name: featured
                label: Vis på forsiden / Show on home page (max 6)
                widget: boolean
                default: false
                required: false
              - name: alt
                label: Kort beskrivelse av bildet (for blinde og Google) / Short description (for blind visitors and Google)
                widget: object
                fields:
                  - name: "no"
                    label: Norsk
                    widget: string
                  - name: en
                    label: English
                    widget: string
            summary: "{{fields.alt.no}} ({{fields.category}})"
            label_singular: Bilde / Photo
            add_to_top: true
  - name: slideshow
    label: Bildeveksling på forsiden / Home slideshow
    icon: slideshow
    description: De store bildene øverst på forsiden. Velg liggende bilder der personene er i midten eller til høyre, siden teksten ligger til venstre. / The large photos at the top of the home page. Pick landscape photos with the people in the middle or on the right.
    files:
      - name: hero
        label: Bilder / Photos
        file: src/content/hero.json
        format: json
        fields:
          - name: slides
            label: Bilder / Photos
            widget: list
            fields:
              - name: image
                label: Bilde / Photo
                widget: image
              - name: position
                label: Utsnitt / Crop position
                widget: string
                required: false
                default: 50% 50%
                hint: 'Hvilken del av bildet som vises: "venstre-høyre topp-bunn", f.eks. "50% 30%" viser litt mer av toppen. / Which part stays visible, e.g. "50% 30%" keeps more of the top.'
              - name: alt
                label: Kort beskrivelse / Short description
                widget: object
                fields:
                  - name: "no"
                    label: Norsk
                    widget: string
                  - name: en
                    label: English
                    widget: string
            summary: "{{fields.alt.no}}"
            label_singular: Bilde / Photo
  - name: pages
    label: Tekst på sidene / Page text
    icon: description
    i18n: true
    files:
      - name: home
        label: Forside / Home
        file: src/content/pages/home.json
        format: json
        i18n: true
        fields:
          - name: hero
            label: Øverst / Top
            widget: object
            fields:
              - name: eyebrow
                label: Liten tekst over navnet / Small text above the name
                widget: string
                i18n: true
              - name: tagline
                label: Slagord / Tagline
                widget: string
                i18n: true
            i18n: true
          - name: intro
            label: Introduksjon / Introduction
            widget: object
            fields:
              - name: heading
                label: Overskrift / Heading
                widget: string
                i18n: true
              - name: text
                label: Tekst / Text
                widget: text
                i18n: true
            i18n: true
          - name: sessionsHeading
            label: Overskrift for fotograferinger / Sessions heading
            widget: string
            i18n: true
          - name: sessionsLink
            label: Lenke til priser / Link to pricing
            widget: string
            i18n: true
          - name: work
            label: Utvalgte bilder / Selected work
            widget: object
            fields:
              - name: heading
                label: Overskrift / Heading
                widget: string
                i18n: true
              - name: cta
                label: Lenketekst / Link text
